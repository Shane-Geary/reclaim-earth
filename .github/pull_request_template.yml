name: Pull Request
description: Please fill out all required fields
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is the purpose of this PR?
      placeholder: Describe the purpose/feature
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Changes
      description: List the main changes
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: How was this tested?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Builds / runs locally
          required: true
        - label: No unintended changes
          required: true

        - type: textarea
          id: unintended_details
          attributes:
            label: If there were unintended changes, describe them
            description: Leave blank if none
            placeholder: Describe any unintended changes here
